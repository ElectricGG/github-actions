name: Salidas

on: workflow_dispatch

jobs:
  calcular:
    runs-on: ubuntu-latest
    outputs:
      nombre: ${{ steps.datos.outputs.nombre }}
    steps:
      - id: datos
        run: echo "nombre=jesus" >> "$GITHUB_OUTPUT"

  usar:
    needs: calcular
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nombre es [${{ needs.calcular.outputs.nombre }}]"