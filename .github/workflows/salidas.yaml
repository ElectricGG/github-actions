name: Salidas

on: 
  workflow_dispatch:
    inputs:
      nombre:
        type: string
        required: true
      ambiente:
        type: choice
        options: [dev, staging, prod]


jobs:
  calcular:
    runs-on: ubuntu-latest
    outputs:
      nombre: ${{ steps.datos.outputs.nombre }}
    steps:
      - id: datos
        run: echo "nombre=${{ inputs.nombre }}" >> "$GITHUB_OUTPUT"

  usar:
    needs: calcular
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nombre es [${{ needs.calcular.outputs.nombre }}]"
      - if: ${{ inputs.ambiente == 'prod' }} 
        run: echo "Cuidado: producción"