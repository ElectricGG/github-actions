name: Hola

on: push

jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - run: echo "MAQUINA=$(hostname) CARPETA=$(pwd)"
      - run: echo "hola" > mensaje.txt

  leer:
    needs: saludar
    runs-on: ubuntu-latest
    steps:
      - run: echo "MAQUINA=$(hostname) CARPETA=$(pwd)"
      - run: echo "leer corrio despues de saludar"