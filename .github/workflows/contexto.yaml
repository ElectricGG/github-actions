name: Contexto

on: 
  push:
  workflow_dispatch:

jobs:
  mostrar:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Evento ${{ github.event_name }}"
      - run: echo "Rama ${{ github.ref_name }}"
      - run: echo "Usuario ${{ github.actor }}"
      - run: echo "Sha ${{ github.sha }}"
      - if: github.event_name == 'push'
        run: echo "Lanzado por un push"
      - if: github.event_name == 'workflow_dispatch'
        run: echo "Lanzado a mano"