name: CI Catálogo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/catalogo   # todos los run: arrancan aquí
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/catalogo/global.json

      - name: Caché de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/catalogo/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build -c Release --no-restore

      - name: Fallo forzado (temporal)
        if: runner.os == 'Windows'
        run: exit 1

      - name: Tests
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./resultados

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ runner.os }}
          path: apps/catalogo/resultados

  cobertura-minima:
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-Linux
          path: cobertura

      - name: Verificar mínimo
        env:
          MINIMO_LINEAS: 80
          MINIMO_RAMAS: 80
        run: |
          archivo=$(find cobertura -name 'coverage.cobertura.xml' | head -1)
          lineas=$(grep -oP '<coverage line-rate="\K[0-9.]+' "$archivo")
          ramas=$(grep -oP '<coverage [^>]*branch-rate="\K[0-9.]+' "$archivo")
          lineas=$(awk "BEGIN { printf \"%d\", $lineas * 100 }")
          ramas=$(awk "BEGIN { printf \"%d\", $ramas * 100 }")

          echo "Líneas: $lineas % (mínimo $MINIMO_LINEAS %)"
          echo "Ramas:  $ramas % (mínimo $MINIMO_RAMAS %)"

          {
            echo "## Cobertura del catálogo"
            echo "| Métrica | Valor | Mínimo |"
            echo "|---|---|---|"
            echo "| Líneas | $lineas % | $MINIMO_LINEAS % |"
            echo "| Ramas | $ramas % | $MINIMO_RAMAS % |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$lineas" -lt "$MINIMO_LINEAS" ] || [ "$ramas" -lt "$MINIMO_RAMAS" ]; then
            echo "::error::Cobertura por debajo del mínimo"
            exit 1
          fi
